<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legal Helper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
    <link rel="stylesheet" href="taskpane.css" />
  </head>
  <body>
    <!-- brand header -->
    <header class="brand">
      <div class="brand-row">
        <div class="brand-left">
          <div class="brand-mark" aria-hidden="true">&amp;</div>
          <div>
            <div class="brand-name display">Legal Helper</div>
            <div class="brand-sub">Document Review</div>
          </div>
        </div>
        <button
          id="settings-toggle"
          class="icon-btn"
          title="Settings"
          aria-label="Settings"
          aria-expanded="false"
        >
          &#9881;
        </button>
      </div>
    </header>

    <div class="content">
      <!-- settings -->
      <section id="settings" class="panel hidden" aria-label="Settings">
        <label class="field">
          <span class="field-label">API base URL</span>
          <input id="api-base" type="text" placeholder="https://legal-helper.example.com" />
        </label>
        <label class="field">
          <span class="field-label">API key (optional)</span>
          <input id="api-key" type="password" placeholder="X-API-Key" />
        </label>
        <button id="save-settings" class="btn-secondary">Save</button>
      </section>

      <section id="review-section" aria-label="Review">
        <!-- PRE-REVIEW: review-scope + review-depth + primary action (hidden once a review has run) -->
        <div id="prereview">
          <div class="depth-row" id="scope-row">
            <div>
              <div class="depth-title display">Review scope</div>
              <div class="depth-cap" id="scope-caption">whole document</div>
            </div>
            <div class="seg-toggle" role="group" aria-label="Review scope">
              <button
                id="scope-whole"
                class="seg-btn is-on"
                type="button"
                data-scope="whole"
                aria-pressed="true"
                title="Review the whole document"
              >
                Whole
              </button>
              <button
                id="scope-redlines"
                class="seg-btn"
                type="button"
                data-scope="redlines"
                aria-pressed="false"
                title="Review only the tracked changes"
              >
                Redlines
              </button>
            </div>
          </div>
          <div class="depth-row">
            <div>
              <div class="depth-title display">Deep review</div>
              <div class="depth-cap" id="depth-caption">few min &middot; most thorough</div>
            </div>
            <button
              id="depth-toggle"
              class="switch is-on"
              type="button"
              role="switch"
              aria-checked="true"
              aria-label="Toggle deep review"
              title="Toggle deep review"
            >
              <span class="switch-knob" aria-hidden="true"></span>
            </button>
          </div>
          <button id="review-btn" class="btn-gold">Review this document&nbsp;&nbsp;&rarr;</button>
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <!-- review summary (rendered by JS) -->
        <section id="summary" class="hidden" aria-label="Review summary"></section>

        <!-- post-review: re-run the missing mode, or (once both have run) toggle the cached view -->
        <section id="runctl" class="runctl hidden" aria-label="Review controls"></section>

        <!-- apply all -->
        <section id="actions" class="hidden">
          <button id="apply-all-btn" class="btn-primary">
            Apply all redlines (tracked changes)
          </button>
        </section>

        <!-- findings / missing clauses / cross-clause (rendered by JS) -->
        <section id="findings"></section>

        <!-- review details (rendered by JS) -->
        <footer id="review-footer" class="hidden"><span id="meta"></span></footer>
      </section>
      <!-- /review-section -->
    </div>

    <script src="taskpane.js"></script>
  </body>
</html>
