<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legal Helper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
    <link rel="stylesheet" href="taskpane.css" />
  </head>
  <body>
    <!-- brand header -->
    <header class="brand">
      <div class="brand-row">
        <div class="brand-left">
          <div class="brand-mark" aria-hidden="true">&amp;</div>
          <div>
            <div class="brand-name display">Legal Helper</div>
            <div class="brand-sub">Document Review</div>
          </div>
        </div>
        <button
          id="settings-toggle"
          class="icon-btn hidden"
          title="Settings"
          aria-label="Settings"
          aria-expanded="false"
        >
          &#9881;
        </button>
      </div>
    </header>

    <div class="content">
      <!-- SIGN IN — shown until a bearer token is stored. Server base URL defaults to the origin
           this page was served from (the same server hosts the API); editable for local dev. -->
      <section id="signin-screen" class="panel" aria-label="Sign in">
        <label class="field">
          <span class="field-label">Server base URL</span>
          <input id="signin-server" type="text" placeholder="https://legal-helper.example.com" />
        </label>
        <label class="field">
          <span class="field-label">Username</span>
          <input id="signin-username" type="text" autocomplete="username" />
        </label>
        <label class="field">
          <span class="field-label">Password</span>
          <input id="signin-password" type="password" autocomplete="current-password" />
        </label>
        <button id="signin-btn" class="btn-gold">Sign in</button>
        <p id="signin-status" class="status" role="status" aria-live="polite"></p>
      </section>

      <!-- ADD KEY — shown once signed in when GET /api/me reports has_key=false. -->
      <section id="addkey-screen" class="panel hidden" aria-label="Add your OpenRouter key">
        <div class="field-label" style="margin-bottom: 10px">Add your OpenRouter key</div>
        <label class="field">
          <span class="field-label">OpenRouter API key</span>
          <input id="addkey-key" type="password" placeholder="sk-or-…" autocomplete="off" />
        </label>
        <button id="addkey-btn" class="btn-gold">Save key</button>
        <p class="status">
          <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">Get a key at openrouter.ai/keys</a>
        </p>
        <p class="status">Stored encrypted on the server — only the last 4 digits are ever shown.</p>
        <p id="addkey-status" class="status" role="status" aria-live="polite"></p>
      </section>

      <!-- settings (⚙) — account + key summary, change key, sign out -->
      <section id="settings" class="panel hidden" aria-label="Settings">
        <p class="field-label" id="settings-account"></p>
        <p class="status" id="settings-key"></p>
        <button id="settings-change-key" class="btn-secondary">Change key</button>
        <button id="settings-signout" class="btn-secondary">Sign out</button>
      </section>

      <!-- READY — everything below is only shown once signed in AND a key is on file. Three
           tabs share one ready-screen wrapper so ⚙ settings and sign-in/add-key stay unaffected. -->
      <div id="ready-screen" class="hidden">
        <nav id="tabs" class="tabs" aria-label="Sections">
          <button type="button" class="tab-btn is-active" data-tab="review">Review</button>
          <button type="button" class="tab-btn" data-tab="history">History</button>
          <button type="button" class="tab-btn" data-tab="usage">Usage</button>
        </nav>

        <section id="review-section" aria-label="Review">
          <!-- PRE-REVIEW: your side + review-depth + primary action (hidden once a review has run) -->
          <div id="prereview">
            <label class="field">
              <span class="field-label">Your side (optional)</span>
              <input
                id="our-side"
                type="text"
                placeholder="e.g. the Customer, the Receiving Party"
              />
            </label>
            <div class="depth-row">
              <div>
                <div class="depth-title display">Deep review</div>
                <div class="depth-cap" id="depth-caption">few min &middot; most thorough</div>
              </div>
              <button
                id="depth-toggle"
                class="switch is-on"
                type="button"
                role="switch"
                aria-checked="true"
                aria-label="Toggle deep review"
                title="Toggle deep review"
              >
                <span class="switch-knob" aria-hidden="true"></span>
              </button>
            </div>
            <button id="review-btn" class="btn-gold">Review this document&nbsp;&nbsp;&rarr;</button>
          </div>

          <p id="status" class="status" role="status" aria-live="polite"></p>

          <!-- review summary (rendered by JS) -->
          <section id="summary" class="hidden" aria-label="Review summary"></section>

          <!-- post-review: re-run the missing mode, or (once both have run) toggle the cached view -->
          <section id="runctl" class="runctl hidden" aria-label="Review controls"></section>

          <!-- apply all -->
          <section id="actions" class="hidden">
            <button id="apply-all-btn" class="btn-primary">
              Apply all redlines (tracked changes)
            </button>
          </section>

          <!-- findings / missing clauses / cross-clause (rendered by JS) -->
          <section id="findings"></section>

          <!-- review details (rendered by JS) -->
          <footer id="review-footer" class="hidden"><span id="meta"></span></footer>
        </section>
        <!-- /review-section -->

        <!-- HISTORY — last 20 reviews; Open re-renders the stored result in the Review tab. -->
        <section id="history-section" class="hidden" aria-label="History">
          <p id="history-status" class="status" role="status" aria-live="polite"></p>
          <div id="history-list"></div>
        </section>

        <!-- USAGE — /api/me/usage as stat tiles + a by-mode/by-model table. -->
        <section id="usage-section" class="hidden" aria-label="Usage">
          <p id="usage-status" class="status" role="status" aria-live="polite"></p>
          <div id="usage-tiles" class="usage-tiles"></div>
          <div id="usage-tables"></div>
        </section>
      </div>
      <!-- /ready-screen -->
    </div>

    <script src="taskpane.js"></script>
  </body>
</html>
