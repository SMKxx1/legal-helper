<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · NDA Assistant admin</title>
  <link rel="stylesheet" href="/admin/static/shell/admin.css">
  <script src="/admin/static/shell/login.js" defer></script>
</head>
<body class="adm adm-login-body">
  <main class="adm-login-shell">
    <div class="adm-card adm-login-card">
      <h1 class="adm-login-title">NDA Assistant</h1>
      <p class="adm-login-sub">Admin console</p>

      <!-- Login form (default view). Posts to the hardened session API (/api/auth/login). -->
      <form id="adm-login-form" class="adm-form" autocomplete="on">
        <div class="adm-field">
          <label class="adm-label" for="login-user">User ID</label>
          <input class="adm-input" id="login-user" name="user_id" type="text"
                 autocomplete="username" required autofocus>
        </div>
        <div class="adm-field">
          <label class="adm-label" for="login-pass">Password</label>
          <input class="adm-input" id="login-pass" name="password" type="password"
                 autocomplete="current-password" required>
        </div>
        <p id="adm-login-error" class="adm-error" role="alert" hidden></p>
        <div class="adm-actions">
          <button type="submit" id="adm-login-submit" class="adm-btn adm-btn-primary">Sign in</button>
        </div>
      </form>

      <!-- Forced password change (shown when the account must change its password). -->
      <form id="adm-change-form" class="adm-form" hidden>
        <p class="adm-login-sub">Choose a new password to continue.</p>
        <div class="adm-field">
          <label class="adm-label" for="change-old">Current password</label>
          <input class="adm-input" id="change-old" name="old_password" type="password"
                 autocomplete="current-password" required>
        </div>
        <div class="adm-field">
          <label class="adm-label" for="change-new">New password</label>
          <input class="adm-input" id="change-new" name="new_password" type="password"
                 autocomplete="new-password" minlength="8" required>
          <p class="adm-help">At least 8 characters.</p>
        </div>
        <p id="adm-change-error" class="adm-error" role="alert" hidden></p>
        <div class="adm-actions">
          <button type="submit" id="adm-change-submit" class="adm-btn adm-btn-primary">Update password</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
